apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediclaim-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediclaim-api
  template:
    metadata:
      labels:
        app: mediclaim-api
    spec:
      containers:
        - name: api
          image: mediclaim-ai-api:latest
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediclaim-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediclaim-web
  template:
    metadata:
      labels:
        app: mediclaim-web
    spec:
      containers:
        - name: web
          image: mediclaim-ai-web:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: mediclaim-api
spec:
  selector:
    app: mediclaim-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mediclaim-web
spec:
  selector:
    app: mediclaim-web
  ports:
    - port: 3000
      targetPort: 3000
